# Local development stack for the Bilyon backend.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   export BILYON_DATABASE_URL=postgres://bilyon:bilyon@127.0.0.1:5432/bilyon?sslmode=disable
#   export BILYON_NATS_URL=nats://127.0.0.1:4222
#   export BILYON_REDIS_URL=redis://127.0.0.1:6379/0
#   export BILYON_TIGERBEETLE_ADDRESSES=127.0.0.1:3000
#
# Versions are pinned to what CI tests against.
name: bilyon

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: bilyon
      POSTGRES_PASSWORD: bilyon
      POSTGRES_DB: bilyon
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=256MB
      - -c
      - wal_level=logical
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bilyon -d bilyon"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.11
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes:
      - natsdata:/data

  tigerbeetle-format:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    command: ["format", "--cluster=0", "--replica=0", "--replica-count=1", "--development", "/data/0_0.tigerbeetle"]
    volumes:
      - tbdata:/data
    restart: "no"

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    depends_on:
      tigerbeetle-format:
        condition: service_completed_successfully
    command: ["start", "--addresses=0.0.0.0:3000", "--development", "/data/0_0.tigerbeetle"]
    ports: ["3000:3000"]
    volumes:
      - tbdata:/data
    security_opt:
      - seccomp=unconfined

volumes:
  pgdata:
  natsdata:
  tbdata:
